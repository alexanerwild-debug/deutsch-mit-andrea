<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fcd116">

  <title>Deutsch mit Andrea ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #fff9e8;
      color: #222;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* FOTO VON ANDREA & ALEX */
    .hero {
      min-height: 54vh;

      background-image:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.05) 20%,
          rgba(0,0,0,0.60) 100%
        ),
        url("./IMG_4100.jpeg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      text-align: center;
      color: white;

      padding: 35px 20px;
    }

    .flags {
      font-size: 32px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 38px;
      line-height: 1.05;
      margin: 0;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    .subtitle {
      font-size: 19px;
      margin-top: 12px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.35);
    }

    .content {
      flex: 1;
      padding: 28px 22px 45px;
      text-align: center;
    }

    .level {
      display: inline-block;
      background: #fcd116;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .welcome {
      font-size: 22px;
      line-height: 1.45;
      margin-bottom: 28px;
    }

    .welcome strong {
      font-size: 25px;
    }

    .start-button {
      display: block;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;

      border: none;
      border-radius: 20px;

      padding: 19px 20px;

      background: #003893;
      color: white;

      font-size: 21px;
      font-weight: 800;

      cursor: pointer;

      box-shadow: 0 8px 20px rgba(0,0,0,0.16);
    }

    .start-button:active {
      transform: scale(0.98);
    }

    .motivation {
      margin-top: 24px;
      color: #666;
      font-size: 15px;
    }

    .footer {
      height: 8px;
      background: #ce1126;
      margin-top: auto;
    }

  </style>
</head>

<body>

  <div class="app">

    <section class="hero">

      <div class="flags">
        🇨🇴 ❤️ 🇩🇪
      </div>

      <h1>
        Deutsch mit Andrea
      </h1>

      <div class="subtitle">
        Tu camino hacia el alemán
      </div>

    </section>


    <main class="content">

      <div class="level">
        Nivel A2
      </div>

      <div class="welcome">

        <strong>
          Hola Andrea ❤️
        </strong>

        <br><br>

        ¿Lista para aprender un poco de alemán hoy?

      </div>


      <button
        class="start-button"
        onclick="startLearning()"
      >
        Empezar 🇩🇪
      </button>


      <div class="motivation">
        Paso a paso. Jeden Tag ein bisschen. ❤️
      </div>

    </main>


    <div class="footer"></div>

  </div>


  <script>

    function startLearning() {

      alert(
        "Super, Baby! ❤️\n\nAhora empezamos con tu primera lección A2."
      );

    }

  </script>

</body>
</html>
