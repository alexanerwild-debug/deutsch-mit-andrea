<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsch mit Andrea ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff8df;
      color: #222;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    .hero {
      position: relative;
      min-height: 55vh;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.05),
          rgba(0,0,0,0.58)
        ),
        url("andrea-alex.jpg") center/cover no-repeat;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 32px 24px;
      color: white;
    }

    .flags {
      font-size: 30px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 18px;
    }

    .content {
      padding: 28px 24px;
    }

    .level {
      display: inline-block;
      background: #fcd116;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .welcome {
      font-size: 21px;
      line-height: 1.4;
      margin-bottom: 26px;
    }

    button {
      width: 100%;
      max-width: 420px;
      border: 0;
      border-radius: 18px;
      padding: 18px;
      font-size: 20px;
      font-weight: 700;
      color: white;
      background: #003893;
      box-shadow: 0 7px 18px rgba(0,0,0,.15);
    }

    .red-line {
      height: 7px;
      background: #ce1126;
      margin-top: auto;
    }
  </style>
</head>

<body>

<div class="app">

  <section class="hero">
    <div class="flags">🇨🇴 ❤️ 🇩🇪</div>
    <h1>Deutsch mit Andrea</h1>
    <div class="subtitle">
      Tu camino hacia el alemán
    </div>
  </section>

  <main class="content">

    <div class="level">
      Nivel A2
    </div>

    <div class="welcome">
      Hola Andrea ❤️<br>
      ¿Lista para aprender un poco de alemán hoy?
    </div>

    <button onclick="startLearning()">
      Empezar 🇩🇪
    </button>

  </main>

  <div class="red-line"></div>

</div>

<script>
  function startLearning() {
    alert("Super, Baby! ❤️ Aquí comenzará tu primera lección A2.");
  }
</script>

</body>
</html>
